<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mecanismos de la plataforma</title>
<!-- Hoja de los dibujos de los mecanismos (2026-10-08). Los dibujos NO viven aca: los hace
     dibujos-mecanismos.js (fuente unica, la misma que usa el modelo 3D). Esta hoja solo los pone en
     una pagina clara para sacar los PNG del Doc «3 - Mecanismos, proveedores y cielo»
     (dibujos-mecanismos.ps1). Una figura sola: ?fig=trans | estrella | palanca | empujon. -->
<style>
:root{--ink:#15202c;--muted:#5a6878;--accent:#b8650a;--axis:#c83a32;--ok:#2f7d4f;--line:#cfd7e1}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:0 0 12px} figure{margin:14px 0} figcaption{font-size:13px;color:var(--muted)}
svg{display:block;width:100%;height:auto}
.solo .wrap>*{display:none} .solo .wrap>figure.on{display:block;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mecanismos de la plataforma VNS</h1>
  <figure id="f-trans"><div id="trans"></div><figcaption>Cuatro maneras de mover la mesa (esquemas, no a escala).</figcaption></figure>
  <figure id="f-estrella"><div id="estrella"></div><figcaption>La estrella en una foto de 60 s, según la transmisión.</figcaption></figure>
  <figure id="f-palanca"><div id="palanca"></div><figcaption>El banco de la palanca óptica: medir el error de micropaso con un puntero láser.</figcaption></figure>
  <figure id="f-empujon"><div id="empujon"></div><figcaption>El empujón que levanta la mesa, visto desde arriba.</figcaption></figure>
</div>
<script src="geometria-vns.js?v=10"></script>
<script src="transmisiones.js?v=3"></script>
<script src="dibujos-mecanismos.js?v=4"></script>
<script>
DIBUJOS.trans(document.getElementById('trans'));
DIBUJOS.estrella(document.getElementById('estrella'));
DIBUJOS.palanca(document.getElementById('palanca'));
DIBUJOS.empujon(document.getElementById('empujon'));
const fig = new URLSearchParams(location.search).get('fig');
if (fig) { document.body.classList.add('solo'); document.getElementById('f-' + fig).classList.add('on'); }
</script>
</body>
</html>
